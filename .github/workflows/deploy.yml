name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nessun permesso di default: ogni job dichiara solo ciò che gli serve.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Azioni fissate a un commit preciso (il tag è indicato a fianco): un tag spostato non cambia il codice eseguito.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      # I valori pubblici arrivano dalle Variables del repository (Settings > Secrets and variables > Actions > Variables),
      # non da un file nel repository. Con CI=true la build si rifiuta di partire se mancano o sono segnaposto.
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_RSVP_API_URL: ${{ vars.VITE_RSVP_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_ROBOTS: ${{ vars.VITE_ROBOTS || 'noindex, nofollow' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
